; Where PHP's ephemeral state lives (#85).
;
; The image loads no php.ini at all, so session.save_path, sys_temp_dir and
; upload_tmp_dir all fell back to /tmp implicitly. Naming them makes the
; writes visible, keeps sessions in a directory request-time GC actually
; cleans, and means one tmpfs at /tmp covers every ephemeral write — which is
; what a read-only root filesystem needs.
;
; The sessions directory is created by startup.sh on every boot, because a
; tmpfs starts empty.
session.save_path = /tmp/wallos-sessions
sys_temp_dir = /tmp
upload_tmp_dir = /tmp
