name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/wallos

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: sqlite3, zip
      - name: Run the test suite
        run: php tests/run.php

  # Which PostgreSQL versions the matrix below runs. Issue #80 asks which
  # versions Wallos works with, and the honest answer is whichever ones CI
  # runs — so instead of a hard-coded list that goes stale the moment upstream
  # retires a major, this job reads what the PostgreSQL project still supports
  # from endoflife.date and hands the ends of that range to the test jobs. The
  # ends are where the failures are: the oldest catches a feature newer than
  # our floor, the newest catches a deprecation. A middle version costs minutes
  # and finds what the ends already found.
  #
  # CI must not die on somebody else's API: if the call fails, times out or
  # answers nonsense, the job falls back to the last span it was known to
  # produce — 14 through 18, as of 2026-08 — and says so in the summary. The
  # fallback can only ever be behind reality, never wrong about what was
  # tested, because the tested versions are whatever the matrix actually ran.
  postgres-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
      oldest: ${{ steps.versions.outputs.oldest }}
      newest: ${{ steps.versions.outputs.newest }}
    steps:
      - name: Determine the supported PostgreSQL range
        id: versions
        run: |
          today="$(date -u +%F)"
          range="$(
            curl -sf --max-time 15 https://endoflife.date/api/postgresql.json |
            jq -r --arg today "$today" '
              [ .[] | select((.eol | type) == "string" and .eol > $today)
                    | .cycle | tonumber ]
              | select(length > 0)
              | "\(min) \(max)"
            '
          )" || range=""

          source="endoflife.date"
          # The floor only ever moves up: an answer older than the recorded
          # fallback is nonsense, not news.
          if ! [[ "$range" =~ ^[0-9]+\ [0-9]+$ ]] || [ "${range% *}" -lt 14 ]; then
            range="14 18"
            source="the recorded fallback (endoflife.date was unreachable or implausible)"
          fi

          oldest="${range% *}"
          newest="${range#* }"

          if [ "$oldest" = "$newest" ]; then
            matrix="[\"$oldest\"]"
          else
            matrix="[\"$oldest\", \"$newest\"]"
          fi

          {
            echo "matrix=$matrix"
            echo "oldest=$oldest"
            echo "newest=$newest"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Tested against PostgreSQL $oldest through $newest"
            echo
            echo "The matrix runs the ends of the range the PostgreSQL project"
            echo "still supports — the oldest catches a feature newer than the"
            echo "floor, the newest catches a deprecation. This run's pair came"
            echo "from $source."
          } >> "$GITHUB_STEP_SUMMARY"

  # The same cases against PostgreSQL, once per end of the supported range the
  # job above determined.
  #
  # This is not decoration. Until it existed the suite ran only on SQLite, and
  # five defects that made the PostgreSQL schema unusable at runtime — three
  # columns whose declared type was not the type they held, a foreign key that
  # rejected an ordinary form value, and a baseline nothing applied — survived
  # to a review rather than being caught here.
  test-pgsql:
    runs-on: ubuntu-latest
    needs: postgres-versions
    strategy:
      fail-fast: false
      matrix:
        postgres: ${{ fromJSON(needs.postgres-versions.outputs.matrix) }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_DB: wallos
          POSTGRES_USER: wallos
          POSTGRES_PASSWORD: wallos-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallos -d wallos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: sqlite3, pdo_pgsql, zip
      - name: Run the test suite against PostgreSQL ${{ matrix.postgres }}
        env:
          WALLOS_TEST_DRIVER: pgsql
          WALLOS_TEST_DB_HOST: 127.0.0.1
          WALLOS_TEST_DB_NAME: wallos
          WALLOS_TEST_DB_USER: wallos
          WALLOS_TEST_DB_PASSWORD: wallos-ci
        run: php tests/run.php

  # Issue #41: SQLite-specific APIs must stay inside the database adapter
  # boundary. That boundary is still being built (issue #20), so the audit
  # ratchets against dev/db-audit-baseline.txt instead of demanding zero: the
  # leakage may shrink, never grow.
  #
  # This is a job of its own rather than a step in `test` because it answers a
  # different question — an architecture question, not "does the code work" —
  # and it needs no PHP, so it reports in seconds and in parallel. A failure
  # still turns the whole workflow red, which is the enforcement; `build` does
  # not depend on it, because refusing to produce an image over a boundary
  # regression only creates pressure to switch the gate off.
  # The shell audit lives in this job rather than in one of its own for the same
  # reason the textual one does: it is grep, it needs nothing installed, and it
  # answers the same question about a file type Semgrep cannot read.
  db-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit the SQLite boundary
        run: dev/db-audit.sh
      - name: Audit the SQLite boundary in shell scripts
        # Runs even when the textual audit failed: the two look at different
        # files, and finding out about both in one run beats two round trips.
        if: always()
        run: dev/sh-audit.sh

  # The same boundary, checked by parsing PHP instead of searching it. Semgrep
  # tells a real `SQLite3 $db` type hint from the 51 docblocks that spell the
  # same words, which a text search cannot — and that is the whole reason gate 2
  # exists: defect #90 was two of the former hidden among the latter.
  #
  # Separate from db-boundary because it is the only part that needs something
  # installed. The grep gates answer in seconds; making them wait on a pip
  # install would spend the property that made them worth having.
  #
  # Semgrep is pinned. An unpinned linter turns somebody else's release into a
  # red build on a branch that changed nothing, and the first fix anybody
  # reaches for then is to switch the gate off.
  db-boundary-semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Semgrep
        run: pipx install semgrep==1.172.0
      - name: Audit the SQLite boundary with Semgrep
        run: dev/semgrep/run.sh --local

  # One missing comma kept every admin-page button dead through six releases
  # (#119): a parse error discards the whole file, the endpoints behind the
  # buttons keep passing every server-side test, and nothing in CI ever read
  # the JavaScript. This parses every served .js file — node --check, no
  # lint, no configuration. Like the boundary gates, `build` does not depend
  # on it; a red gate is the enforcement, not a refused image.
  js-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every served JavaScript file
        run: dev/js-audit.sh --local

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          # Scope cache per platform to prevent architecture-mismatched layers
          cache-from: type=gha,scope=${{ github.workflow }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-${{ matrix.platform }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Show published tags
        run: jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"

  # The GitHub release object is part of the release, not an afterthought:
  # checkforupdates asks /releases/latest, so a tag pushed without a release
  # left every installation believing the previous version was current —
  # caught by the test instance the night 5.9.0 shipped as a tag only. The
  # notes are the tag's CHANGELOG section, which carries anything a release
  # must say (5.9.0's #92 caveat, for instance). Idempotent: a release that
  # already exists — created by hand with a better title — is left alone.
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, test-pgsql, merge]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the GitHub release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it alone."
            exit 0
          fi

          awk -v v="$version" '
            $0 ~ ("^## \\[" v "\\]") { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md

          if ! [ -s notes.md ]; then
            echo "No CHANGELOG section for $version — refusing to publish an empty release." >&2
            exit 1
          fi

          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --title "$version" --notes-file notes.md --verify-tag
