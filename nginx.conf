user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       [::]:80 ipv6only=off;
        server_name  localhost;

        location / {
            root   /var/www/html;
            index  index.php;
        }

        # Deny rules must precede the generic \.php$ handler below. nginx evaluates
        # regex locations in order and uses the first match, so these have to come
        # first — otherwise \.php$ matches and executes PHP under .tmp/, logos/, etc.
        location ~ \.db$ {
            deny all;
            return 403;
        }

        # Everything the web server user can write to, refused before the handler
        # below can execute it (issue #94). The ownership split in 5.8.0 made the
        # application code unwritable and left exactly these directories writable —
        # db/, images/uploads/ and everything under it — so they are the ones that
        # must not execute.
        #
        # By prefix rather than one location per directory: the previous set named
        # images/uploads/logos/ and missed images/uploads/icons/, which executes and
        # which nothing writes to at all. A rule that has to be extended every time
        # a directory is added is a rule that will be out of date again.
        #
        # phtml, phar and phps as well as php: php-fpm is asked to run whatever the
        # \.php$ handler passes it, and the handler is not the only way a file gets
        # there. security.limit_extensions in the pool is the second half of this.
        location ~* ^/(db|images/uploads)/.*\.(php|phtml|phar|phps|php[0-9])$ {
            deny all;
            return 403;
        }

        # Block all direct access to the temp working directory. Nothing there is
        # ever meant to be served (backups, restore staging, etc.). The prefix
        # match outranks the \.php$ regex below, so extracted PHP is unreachable.
        location ^~ /.tmp/ {
            deny all;
            return 403;
        }

        location ~* ^/includes/.*\.php$ {
            deny all;
            return 403;
        }

        location ~ \.php$ {
            root           /var/www/html;
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include        fastcgi_params;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}